<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author }}">

    <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>

    <!-- Favicons -->
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
    <link rel="icon" type="image/png" href="{{ '/img/favicon/favicon-32.png' | relative_url }}" sizes="32x32">
    <link rel="icon" type="image/png" href="{{ '/img/favicon/favicon-16.png' | relative_url }}" sizes="16x16">
    <link rel="apple-touch-icon" href="{{ '/img/favicon/apple-touch-icon.png' | relative_url }}">

    <!-- Bootstrap Core CSS -->
    <link href="{{ '/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">

    <!-- Theme CSS (compiled from _sass/ by Jekyll) -->
    <link href="{{ '/css/main.css' | relative_url }}" rel="stylesheet">

    <!-- Custom Fonts -->
    <link href="{{ '/vendor/font-awesome/css/font-awesome.min.css' | relative_url }}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->

</head>
