# Lab members, in two groups. Display order within each group is file order.
#
#   name  Displayed under the photo (required)
#   img   Photo; any size or aspect ratio - it is cropped to a 240px circle
#   title Role. Shown for current members; omit it for past members
#   link  Optional profile URL - omit it and the photo is not a link
#
# The "Current Members" and "Past Members" headings only appear once `past`
# has someone in it, so the page reads the same as before until then.

current:
  - name: "Feng Guo"
    title: "Lab leader"
    img: "img/people/guo.jpeg"
    link: "https://www.stat.vt.edu/people/stat-faculty/guo-feng.html"

  - name: "Liang Shi"
    title: "CV and ML researcher"
    img: "img/people/liang.jpeg"
    link: "https://www.vtti.vt.edu/staffdir/bio.php?&pn=15189"
    
