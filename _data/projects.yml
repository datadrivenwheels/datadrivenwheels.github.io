# Projects shown in the "Projects" grid and their detail modals.
#
# Each entry renders one grid tile plus one modal. Order here is the order on
# the page. Fields:
#   title       Modal heading (required)
#   thumb       Grid tile image (required)
#   image       Modal image; falls back to `thumb` if omitted
#   description Modal body text — inline HTML is allowed and not escaped
#   details     List of {label, value, url}; `url` is optional
#   placeholder true marks unfinished boilerplate — see TODO notes below

- title: "Real-Time Driving Risk Assessment using Deep Learning with XGBoost"
  thumb: "img/projects/project1.png"
  description: >-
    Traffic crashes typically occur in a few seconds and real-time prediction
    can significantly benefit traffic safety management and the development of
    safety countermeasures. This paper presents a novel deep learning model for
    crash identification based on high-frequency, high-resolution continuous
    driving data. A <a href="https://utc-deep-prediction.cloud.vtti.vt.edu/">web-base
    app</a> is built to issue the model's performance.
  details:
    - label: "Related Paper"
      value: "link"
      url: "http://startbootstrap.com"
    - label: "Date"
      value: "April 2022"

