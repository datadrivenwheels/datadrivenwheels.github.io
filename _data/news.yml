# News board, newest first (display order is file order, so add new items on top).
#
#   date       A YAML date, YYYY-MM-DD. Rendered as "Aug 26, 2026".
#   date_text  Use instead of `date` for something a date cannot express,
#              e.g. "Fall 2026". Takes precedence over `date`.
#   text       The item itself. Inline HTML is allowed and not escaped.
#   url        Optional. Makes the item text a link.
#
# The whole section disappears if this file is empty, so there is no empty
# panel to look at before the first real item.
#
# ---------------------------------------------------------------------------
# TODO: placeholders so the board is visible and scrollable. Replace them with
# real lab news - paper acceptances, awards, new members, talks.
# ---------------------------------------------------------------------------

